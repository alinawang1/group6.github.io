  overview:
    title: "Overview"
    text: "Our project analyzes the 2024 California Health Interview Survey (CHIS) Adult Public Use File, one year of data, adult respondents only."
    section: overview
    list: []
    body: |
      In the summer of 2020, as COVID-19 strained California's healthcare system, wildfire smoke blanketed the state for weeks, a stark reminder that public health crises rarely arrive one at a time, and that the ability to protect oneself from them is never evenly distributed. Two in five California adults report having been exposed to wildfire smoke in just the past two years, and the harm that exposure causes depends heavily on whether a person can afford an air filter, has time to see a doctor, or lives close enough to a pharmacy to fill a prescription without delay (CHIS 2024). That same unevenness, two crises landing on top of each other and falling hardest on people with the fewest resources to respond, is the pattern this project sets out to trace. This project shows that social and economic inequality shapes people's actual ability to protect their health at every stage. The project examines not just whether a health risk exists, but whether a person has the resources to guard against it, the everyday conditions to prevent it, and the access to care to treat it once it occurs. Extending beyond the inequalities, the project asks whether current California policy is actually closing those gaps or merely acknowledging them. We trace this pattern across three connected stages: environmental protection, focusing on wildfire smoke exposure and unequal access to filtered air, everyday prevention, examining neighborhood safety, physical activity, housing instability, and food access as conditions that make public health recommendations easier for some Californians to follow than others, and healthcare access, looking beyond insurance coverage to whether people can actually secure appointments, see specialists, and receive the care they need. In each section, we first use CHIS data to establish where the inequity lies, then examine the relevant California policy response to evaluate whether it meaningfully addresses the problem it targets. To do this, we draw on the 2024 California Health Interview Survey (CHIS) Adult Public Use File, released by the UCLA Center for Health Policy Research, the largest state health survey in the country and the only source of detailed, population representative health data for California, making it uniquely suited to tracing how disadvantage compounds across the stages of protecting, preventing, and accessing care.
      
      Existing research argues that health inequality is driven by social, economic, and environmental conditions rather than individual choices. Cantor and colleagues found that a neighborhood's overall income level shapes residents' walking habits, sugary beverage consumption, and obesity risk independently of their own household income, using CHIS survey data cross-referenced against SNAP-Ed neighborhood eligibility maps (Cantor et al. 2020). Wildfire smoke exposure follows this same uneven pattern. Koman and colleagues used satellite-derived PM2.5 modeling to show that some California counties experience far more high-smoke days than others (Koman et al. 2019), and Do and colleagues found that the respiratory harm caused by that smoke is spatially concentrated rather than evenly distributed across the state (Do et al. 2024). Jones and colleagues linked short-term smoke exposure directly to a rise in out-of-hospital cardiac arrests during the 2015 to 2017 California wildfires (Jones et al. 2020), and Hopfer and colleagues found that residents of four Southern California communities described repeated smoke events as a compounding physical and financial strain, especially in households without reliable filtered air (Hopfer et al. 2024). Palinkas and colleagues found that low-income urban residents often relied on improvised responses, like sealing windows or leaving town, in place of the filtration systems or smart thermostats that wealthier households could afford (Palinkas et al. 2023, Dallo et al. 2025).
      
      Studies of food access, neighborhood safety, and chronic illness show this same gap between resources existing and resources being usable. Dubowitz and colleagues found that food desert residents' diets and body mass outcomes were shaped less by personal preference than by what was actually stocked and priced in nearby stores (Dubowitz et al. 2015). Meyer, Castro-Schilo, and Aguilar-Gaxiola found that neighborhood safety and physical activity levels predicted mental and self-rated health about as strongly as socioeconomic status did (Meyer et al. 2014). Hacker and colleagues found that adults with chronic disease who also reported unmet social needs, such as housing or food insecurity, had worse outcomes than those managing chronic disease alone (Hacker et al. 2024).
      
      New technologies and coverage expansions have not closed these gaps either, and research suggests they can introduce new obstacles of their own. Saeed and Masters found that telehealth expansion widened rather than narrowed care disparities for patients without reliable internet access or digital literacy (Saeed and Masters 2021). Faiz and colleagues interviewed Medi-Cal providers and found that patients often lost coverage or delayed care because of administrative friction, like re-enrollment paperwork and long wait times, rather than a lack of insurance itself (Faiz et al. 2024). Tolbert and colleagues found that cost and low awareness kept many Californians uninsured even when they were technically eligible for coverage (Tolbert et al. 2026). Guendelman, Angulo, and Oman found that working poor families in California often had insurance but still struggled to secure timely appointments for their children (Guendelman et al. 2005), and Lai, Tuohy, and Waldinger found that immigration status independently predicted whether Latino adults used preventive care at all, regardless of whether they had coverage (Lai et al. 2025). The literature challenges policies that address only the surface level question of whether a service or resource technically exists, rather than examining whether environmental protection, everyday prevention, and healthcare access problems connect and compound for patients.
      
      These findings do not contradict one another so much as stay siloed. Cantor, Koman, Do, Jones, Hopfer, Palinkas, and Dallo study environmental protection. Dubowitz, Meyer, and Hacker study everyday living conditions. Saeed and Masters, Faiz, Tolbert, Guendelman, and Lai study healthcare access. Almost none of them examine how falling behind at one stage shapes what happens at the next one. There is also not much agreement on which interventions actually work. Subsidies, infrastructure spending, and expanded insurance coverage all sound like solutions, but it is unclear which of them meaningfully close these gaps rather than just look good on paper. The biggest gap in the research is that almost nobody has tested California's own policies against real population level data to see whether they are closing these compounding gaps or just acknowledging that they exist. This is the gap our project is trying to fill.
      
      This project matters because the barriers Californians face in protecting their health do not occur separately, even though they are often studied and addressed that way, as the sources above show. Environmental protection, everyday prevention, and healthcare access are connected stages of the same larger problem. People who are already socially or economically disadvantaged are often less able to avoid health risks, less able to prevent health problems, and less able to receive care once those problems occur. By bringing these stages together in one project, we aim to understand whether California's current policies actually reduce health inequities or mainly acknowledge that they exist. We are working on health inequality in California because we want to find out whether policy responses match the real conditions shown in population level data, so that others can better understand where policy is succeeding, where it falls short, and which barriers remain unresolved. This matters because a policy may expand coverage, promote prevention, or recognize environmental risk, but still fail if people cannot afford protective resources, live in safe and stable neighborhoods, or access timely medical care. Our project, therefore, shifts the focus from whether resources technically exist to whether Californians can realistically use them. Understanding this distinction can help researchers, policymakers, and communities evaluate health equity more effectively and design interventions that respond to the lived conditions shaping people's ability to protect their health.
 
  data_visualizations:
    title: "Data Visualizations"
    text: "Six original charts exploring housing stability, insurance access, and wildfire exposure across California"
    section: data-visualizations
    closebutton: "Close"
    body: |
      ## Housing Stability

      After the environmental section shows that Californians are not equally exposed to or protected from health risks, the housing theme moves the project into everyday living conditions. This section asks whether people have the stable environments needed to follow basic health recommendations in the first place.

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/figure1-housing-financial-sacrifices.png" alt="Line chart showing that adults with unstable housing reported higher rates of cutting back on healthcare and healthy food than adults with stable housing">
        <figcaption>Figure 1: Housing Stability and Health-Related Financial Sacrifices</figcaption>
      </figure>

      The first housing figure shows that housing instability is strongly associated with financial sacrifices that directly affect health. Among adults with stable housing, only **3.7%** reported cutting back on healthcare and **8.5%** reported cutting back on healthy food. Among adults with unstable housing, those numbers rise to **18.9%** and **38.3%**. The increase is especially large for healthy food, where the rate among unstably housed adults is more than four times the rate among stably housed adults. This suggests that housing instability is not only about shelter. It also shapes whether people can afford the everyday resources that allow them to stay healthy.

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/figure2-housing-disadvantages.png" alt="Line chart showing that adults with unstable housing reported higher rates of insufficient physical activity, unsafe neighborhoods, and secondhand smoke or vape exposure than adults with stable housing">
        <figcaption>Figure 2: Everyday Health Disadvantages by Housing Stability</figcaption>
      </figure>

      The second housing figure deepens this finding by showing that unstable housing is also associated with everyday health disadvantages. Adults with unstable housing reported higher insufficient physical activity than adults with stable housing, **48.9% compared with 34.7%**. They also reported much higher exposure to unsafe neighborhoods, **41.1% compared with only 8.6%** among stably housed adults. Secondhand smoke or vape exposure was also higher among adults with unstable or somewhat stable housing than among stably housed adults. Together, the two housing figures show that prevention is not simply a matter of individual choice. Advice like "eat healthy," "exercise more," "avoid smoke," or "seek care early" assumes that people have enough money, safe surroundings, stable housing, and some control over their home environment. The CHIS data show that these conditions are not evenly distributed.

      California has already started to recognize that housing, food, and health are closely connected. One major example is **CalAIM**, California's multi-year Medi-Cal transformation, which began implementation in **2022**. Through CalAIM Community Supports, Medi-Cal managed care plans can offer services such as housing navigation, help with housing deposits, tenancy support, and medically supportive food. These supports were already in place during the **2024 CHIS survey year**. DHCS later reported that in **2024**, more than **494,000 Community Supports** were delivered to more than **252,000 Medi-Cal members**, and people who used the "Housing Trio" had lower inpatient and emergency department use in the following six months. California also has **CalFresh**, the state-administered SNAP program, which helps low-income households pay for food each month.

      California has also moved toward understanding prevention as something shaped by place, not just by personal choice. The **Health in All Policies Task Force**, established in **2010**, connects health equity with housing, transportation, food access, parks, violence prevention, and environmental conditions. The **Active Transportation Program**, created in **2013**, funds walking and biking infrastructure to improve safety, public health, and access for disadvantaged communities. California's tobacco-control system goes back even further: voters approved **Proposition 99 in 1988**, and the California Tobacco Control Program began in **1989**. By 2024, CDPH still identified secondhand smoke in multi-unit housing as a public health concern, especially because smoke can travel between units even when a household does not smoke.

      These efforts matter because they show that California is not treating health as only a personal responsibility. The state has built policies around a simple but important idea: people's health depends on whether they have stable housing, enough food, safe streets, clean indoor air, and supportive neighborhoods. But the 2024 CHIS findings and our analysis show that recognizing these connections is not the same as closing the gaps. Being physically active depends on whether people have safe sidewalks, parks, lighting, transportation, time, and neighborhood safety. Avoiding smoke exposure depends on housing type, ventilation, landlord rules, local enforcement, and whether tenants feel safe reporting problems. Living in a safe neighborhood also depends on larger issues such as housing affordability, community investment, environmental quality, and infrastructure.

      The remaining problem, then, is not that California has done nothing. The deeper issue is whether these policies reach people at the right scale, in the right place, and at the right time. The Legislative Analyst's Office reported in **2025**, using data through **2024**, that CalAIM Community Supports utilization was still relatively low and varied across counties and managed care plans. It also identified administrative complexity, provider capacity, and lack of available housing as major barriers. This matters because housing navigation cannot fully solve a housing shortage, and statewide prevention goals may take multiple years to become real changes in people's neighborhoods. Even when policies are well designed, their effects can look very different depending on where someone lives.

      **Policy Recommendation:** California should bring housing, food, healthcare, and neighborhood prevention closer together in practice. When someone reports housing instability, they should not have to figure out CalFresh, CalAIM housing supports, medically supportive food, and healthcare navigation separately. Housing instability should trigger a more coordinated response across these systems. At the same time, prevention investments should be directed toward communities where housing instability is concentrated, including safer walking routes, parks, lighting, smoke-free multi-unit housing enforcement, and neighborhood safety improvements. The goal is not only to tell people how to protect their health, but to make those choices realistically possible in the places where they live.

      ## Insurance Type and Health Care Access

      After the housing section shows that health is shaped by everyday living conditions before people enter the healthcare system, the healthcare theme asks what happens once people need formal care. The two healthcare figures should be read as two stages of access. The first asks whether adults have a regular place to receive care. The second asks what kinds of barriers appear after a medication has already been prescribed. Together, they show that healthcare access is not one single doorway, it is a chain that can break at multiple points.

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/figure3-usual-source-of-care.png" alt="Bar chart showing that uninsured adults reported much lower access to a usual source of care than insured adults across insurance categories">
        <figcaption>Figure 3: Insurance Type and Usual Source of Care</figcaption>
      </figure>

      The first healthcare figure shows that insurance status remains strongly associated with connection to routine care. Most insured groups reported relatively high access to a usual source of care: employment-based insurance was **95.5%**, Medicaid was **89.3%**, Medicare-only was **85.3%**, and other public insurance was **83.6%**. By contrast, only **49.9%** of uninsured adults reported having a usual source of care. This is one of the clearest findings in the healthcare section because it shows that lack of insurance is still closely tied to being disconnected from regular care.

      California has made major policy efforts to reduce uninsurance. Covered California was approved as a state-based exchange in **2013**, with ACA marketplace coverage beginning in **2014**. Covered California later reported that California's uninsured rate fell from **17.2%** at the start of the ACA marketplace period to **6.4% in 2023**. California also expanded Medi-Cal eligibility over time, including full-scope Medi-Cal for adults ages **26 through 49 regardless of immigration status beginning January 1, 2024**. This timing matters because the expansion was active during the **2024 CHIS year**, but it was still new, so the data should not be treated as a full long-term evaluation of that policy.

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/figure4-medication-delay-urban-rural.png" alt="Dumbbell chart showing urban-rural differences in reported reasons for prescription medication delay or nonreceipt among adults who delayed or did not obtain prescribed medication">
        <figcaption>Figure 4: Urban-Rural Differences in Prescription Medication Delay Reasons</figcaption>
      </figure>

      The second healthcare figure adds another piece to the access story by looking at prescription medication delay or nonreceipt. The first healthcare figure asks whether people have a regular place to go for care. This figure asks what happens after someone has already made it into the healthcare system and received a prescription. That difference matters because access does not stop once a patient leaves the doctor's office. Someone can have insurance, see a provider, and still not be able to get the medication they were prescribed.

      Among California adults who delayed or did not obtain a prescribed medication in the past 12 months, the biggest urban-rural difference was in communication delays with a provider or pharmacy. **19.2%** of rural residents reported this as their main reason, compared with **12.4%** of urban residents. Medication being out of stock showed the opposite pattern: **16.4%** of urban residents reported this reason, compared with **12.9%** of rural residents. Cost and insurance approval problems were almost the same across urban and rural residents, which suggests that some medication barriers are local or place-based, while others affect people across the state.

      Together, the two healthcare figures show that healthcare access is not one single step. Insurance can help people enter the system, and the usual-source-of-care figure shows that uninsured adults are much less likely to have a regular place for care. But the medication-delay figure shows that even after someone receives a prescription, access can still break down. A patient may be waiting for insurance approval, a pharmacy may not have the medication in stock, or communication between the provider and pharmacy may not happen smoothly. The rural communication gap is especially important because rural access problems may not always look like a total lack of care. Sometimes they appears as waiting, confusion, missed messages, or difficulty coordinating between patients, providers, pharmacies, and insurers.

      California has taken policy steps to make medication access and insurance coverage more reliable. **Medi-Cal Rx** fully began on **January 1, 2022**, moving Medi-Cal pharmacy benefits into a statewide fee-for-service system. DHCS describes Medi-Cal Rx as a way to standardize pharmacy benefits across the state, expand access through a network that includes about **94%** of California pharmacies, and apply statewide utilization management rules. Covered California also launched a state-enhanced cost-sharing reduction program for **coverage year 2024**, lowering deductibles, generic drug costs, copays, and other out-of-pocket costs for many enrollees.

      Still, the 2024 CHIS findings show why access cannot be measured only by whether someone has insurance or whether a program exists. Some uninsured Californians may still qualify for Medi-Cal or marketplace subsidies but remain unenrolled because of cost concerns, paperwork, immigration concerns, language barriers, mistrust, or confusion about how to navigate the system. And even after someone gets coverage, that does not automatically mean they have a provider who can respond quickly or a system that coordinates smoothly. California also faces a broader capacity problem: the state projects that it will need **10,500 additional primary care providers by 2030**, and about **7 million Californians** live in health professional shortage areas. These shortages can make follow-up and communication harder, especially in places with fewer providers or pharmacies.

      **Policy Recommendation:** California should move from focusing only on coverage to focusing on whether people can actually complete care. Reducing the uninsured rate is still important, but policymakers should also ask, do people have a regular place to go? Can they understand and navigate enrollment? Can they communicate with providers and pharmacies? Can they actually pick up the medication they were prescribed? This means strengthening enrollment assistance, language support, clinic assignment, community health center referrals, pharmacy coordination, and primary care capacity in shortage areas, and many other aspects. Insurance may open the door to care, but the CHIS findings show that real access depends on whether people can move through the system and actually receive what they need.

      ## Wildfire Exposure and Protective Resources

      The environmental section provides insight into how equally protected state residents are from wildfire smoke. In this section, we examine how exposure varies across households and ask whether they have the resources needed to reduce their exposure. The first visualization investigates wildfire smoke exposure within different communities, with the second visualization tracking the access to filtered air across poverty levels and English proficiency.

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/figure5-wildfire-exposure.png" alt="Bar chart of wildfire smoke exposure by community type">
        <figcaption>Figure 5: Wildfire Smoke Exposure by Community Type</figcaption>
      </figure>

      The first visualization shows that wildfire smoke exposure differs substantially between rural and urban communities. Approximately 55.6% of rural residents reported experiencing wildfire smoke during the previous two years, compared with only 35.1% of urban residents. Conversely, nearly 65% of urban residents reported not experiencing wildfire smoke, compared with only 44.4% of rural residents. These findings suggest that Californians living in rural communities face greater environmental health risks simply because of where they live, as rural areas are more often than not surrounded by forests and wilderness, making repeated wildfire exposure much more likely to occur.

      California already has many wildfire policies implemented as part of its safety protocols to prevent smoke exposure. The California Department of Forestry and Fire Protection, also known as **CAL FIRE**, is continuously working to advance fuel reduction projects, community wildfire resilience planning, and forest management. Protection protocols and smoke advisories are also promoted by several California health organizations, such as the California Air Resources Board and the California Department of Public Health. These actions push for further safety measures to be implemented throughout the state's public health system and show that wildfire smoke has become a recurring public health issue.

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/figure6-filtered-air-access.png" alt="Heatmap of access to filtered air by poverty level and English proficiency">
        <figcaption>Figure 6: Access to Filtered Air by Poverty Level and English Proficiency</figcaption>
      </figure>

      Figure 6 builds on the first by showing that exposure alone does not determine health risk, as protection depends on whether people can access filtered indoor air at all. We are shown that the highest access to filtered air appears among English speakers who are at least **300% above the Federal Poverty Level (FPL)**, as 76.7% reported having filtered air, while only 41.4% of limited English proficient adults earning 200-299% FPL reported access. The gap in English proficiency correlates with access to filtered air, remaining evident even among households with similar income levels, showing us how language barriers are one of the larger factors affecting access to protective equipment.

      Together, the two environmental figures show that wildfire risk is created by both exposure and preparedness. Rural residents are more likely to encounter wildfire smoke, while lower-income and limited English proficient populations are less likely to have access to one of the most effective methods for reducing smoke exposure. This means that the populations facing the greatest environmental hazards may also have the fewest resources available to protect themselves.

      The CHIS survey is a prime example of California's recognition of these inequities. During the **2023-2024** survey cycle, CHIS added new questions on access to filtered air during wildfire smoke and introduced limited English proficiency (LEP) as a new weighting category to better represent those who face language barriers and may need additional assistance. The survey also conducted extensive oversampling of populations that are traditionally underrepresented in health research to produce stronger data and help bring recognition to everyone's safety more equally.

      These changes align with California's broader environmental health policies, which increasingly recognize that vulnerable communities require additional support during wildfire events. However, the CHIS findings suggest that significant disparities remain. While the state has expanded smoke warning systems, Clean Air Centers, and community preparedness programs, access to protective resources is still uneven.

      **Policy Recommendation:** California should continue expanding its wildfire prevention protocols, as it has already been doing, but begin prioritizing communities with both high smoke exposure and limited protective resources. Lower-income households should receive higher priority in the distribution of portable HEPA air filtration units, especially in wildfire-prone regions, along with an expansion of multilingual outreach to better help residents whose first language is not English understand important information. Strengthening partnerships between schools, libraries, and community organizations should also be implemented to provide additional Clean Air Centers with easier access in more rural communities. With these actions, California can more effectively expand its existing wildfire policies while addressing the socioeconomic and language barriers highlighted by the CHIS findings.

  maps_and_timeline:
    title: "Maps and Timeline"
    text: "Geographic and historical context for our findings"
    section: maps-and-timeline
    body: |
      ## Map

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/map-uninsured-by-county.png" alt="Map of California showing the percentage of the civilian non-institutionalized population without health insurance coverage by county">
        <figcaption>Total Civilian Non-Institutionalized Population: No Health Insurance Coverage, ACS 2024 (5-Year Estimates)</figcaption>
      </figure>

      Our map visualization shows the percentage of California's civilian non-institutionalized population without health insurance coverage, broken down by county. The shades represent ranges of insurance rates, with darker orange indicating counties with higher percentages of uninsured residents and lighter orange indicating counties with lower rates. Every shade of orange in the legend can be seen throughout the state, indicating disproportionate access to health care. Over the years, California has implemented policies to expand health insurance coverage, such as the Medi-Cal expansion and Covered California. Although these actions have helped progressed California's overall push for coverage, both insurance and socioeconomic inequalities are still preventing many from receiving proper healthcare access.

