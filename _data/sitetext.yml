  overview:
    title: "Overview"
    text: "Our project analyzes the 2024 California Health Interview Survey (CHIS) Adult Public Use File, one year of data, adult respondents only."
    section: overview
    list: []
    body: |
      In the summer of 2020, as COVID-19 strained California's healthcare system, wildfire smoke blanketed the state for weeks, a stark reminder that public health crises rarely arrive one at a time, and that the ability to protect oneself from them is never evenly distributed. Two in five California adults report having been exposed to wildfire smoke in just the past two years, and the harm that exposure causes depends heavily on whether a person can afford an air filter, has time to see a doctor, or lives close enough to a pharmacy to fill a prescription without delay. This project shows that social and economic inequality shapes people's actual ability to protect their health at every stage. The project examines not just whether a health risk exists, but whether a person has the resources to guard against it, the everyday conditions to prevent it, and the access to care to treat it once it occurs. Extending beyond the inequalities, the project asks whether current California policy is actually closing those gaps or merely acknowledging them.

      We trace this pattern across three connected stages: environmental protection, focusing on wildfire smoke exposure and unequal access to filtered air. Everyday prevention, examining neighborhood safety, physical activity, housing instability, and food access as conditions that make public health recommendations easier for some Californians to follow than others. Healthcare access, looking beyond insurance coverage to whether people can actually secure appointments, see specialists, and receive the care they need. In each section, we first use CHIS data to establish where the inequity lies, then examine the relevant California policy response to evaluate whether it meaningfully addresses the problem it targets. To do this, we draw on the 2024 California Health Interview Survey (CHIS) Adult Public Use File, released by the UCLA Center for Health Policy Research, the largest state health survey in the country and the only source of detailed, population-representative health data for California, making it uniquely suited to tracing how disadvantage compounds across the stages of protecting, preventing, and accessing care.

      Existing research argues that health inequality is driven by social, economic, and environmental conditions rather than individual choices. Research suggests that wildfire smoke exposure affects people's health unevenly across California, revealing how marginalized communities have limited resources such as air conditioning, housing, and relocation. Studies of food access, neighborhood safety, chronic illness, and physical activity similarly reveal that having resources available does not mean they are affordable, in reach, or beneficial. Moreover, research suggests an increase in new technologies such as telehealth, insurance expansion, and medical care that instead poses a challenge, preventing patients from accessing efficient healthcare. The literature challenges policies that discuss surface-level questions of whether a service or resource exists rather than examining if environmental protection, everyday protection, and access to healthcare problems connect and worsen for patients.

      The resources don't necessarily contradict one another. Most studies look at environmental protection, everyday living conditions, or healthcare access as separate problems. However, this can make it difficult to realize how falling behind at one stage actually shapes what happens at the next one. In addition, there's not much agreement on which kinds of changes or interventions actually work. Things like subsidies, infrastructure spending, or expanding insurance coverage seem like solutions, but it's unclear which of them meaningfully close these gaps. They may just look good on paper. In fact, the biggest gap in the research is that almost nobody has actually tested California's own policies against real population-level data to see whether they're closing these compounding gaps or just acknowledging that they exist. This is the gap that our project is trying to fill.

      This project is important because the barriers Californians face in protecting their health do not occur separately, even though they are often studied and addressed that way. Environmental protection, everyday prevention, and healthcare access are connected stages of the same larger problem: people who are already socially or economically disadvantaged are often less able to avoid health risks, less able to prevent health problems, and less able to receive care once those problems occur. By bringing these stages together in one project, we aim to understand whether California's current policies actually reduce health inequities or mainly acknowledge that they exist. We are working on health inequality in California because we want to find out whether policy responses match the real conditions shown in population-level data, so that others can better understand where policy is succeeding, where it falls short, and which barriers remain unresolved. This matters because a policy may expand coverage, promote prevention, or recognize environmental risk, but still fail if people cannot afford protective resources, live in safe and stable neighborhoods, or access timely medical care. Our project, therefore, shifts the focus from whether resources technically exist to whether Californians can realistically use them. Understanding this distinction can help researchers, policymakers, and communities evaluate health equity more effectively and design interventions that respond to the lived conditions shaping people's ability to protect their health.
  
   data_visualizations:
    title: "Data Visualizations"
    text: "Five original charts exploring housing stability, insurance access, and wildfire exposure across California"
    section: data-visualizations
    closebutton: "Close"
    body: |
      ## Housing Stability

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/figure1-housing-financial-sacrifices.png" alt="Bar chart of health-related financial sacrifices by housing stability">
        <figcaption>Figure 1: Health-Related Financial Sacrifices by Housing Stability</figcaption>
      </figure>

      The starkest number here is the healthcare line for the Unstable group: 38.3%, roughly double the Somewhat Stable group's 18.9% and well above the Stable group's 25.3%. That's a real cliff, not a gradual slope, it suggests healthcare spending doesn't get squeezed steadily as housing gets shakier, it gets squeezed hard once housing crosses into genuine instability. What complicates the story is that healthy-food cutbacks don't track the same curve: Stable (13.7%) actually outpaces Unstable (8.5%), with Somewhat Stable lowest of all (3.7%). Read literally, the group with the *least* housing precarity reports cutting back on food more than the group with the *most* precarity. That's counterintuitive enough to be worth sitting with rather than smoothing over. One possibility is that households in real housing crisis have already cut food spending to a floor they can't reduce further, so the *marginal* cutback shows up elsewhere (healthcare) instead. Another is that this reflects the volatility of small survey subsamples, CHIS's "Unstable" and "Somewhat Stable" housing categories are likely thinner slices of the sample, so single-percentage-point comparisons carry more noise than a story about "the poorest households sacrifice most" would imply. Either way, the honest finding is a spike, not a slope: housing instability doesn't sacrifice everything evenly, it forces a specific, uneven set of trade-offs.

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/figure2-housing-disadvantages.png" alt="Bar chart of everyday health disadvantages by housing stability">
        <figcaption>Figure 2: Everyday Health Disadvantages by Housing Stability</figcaption>
      </figure>

      None of the three measures move in a straightforward line with housing stability, and that's the finding. Secondhand smoke/vape exposure dips from 42.7% (Stable) to 32.0% (Somewhat Stable) before climbing to 48.9% (Unstable), the same dip-then-spike shape that shows up in Figure 1's healthcare sacrifice data, which makes it feel less like a fluke and more like a real feature of how the middle "Somewhat Stable" category behaves in this dataset. Unsafe-neighborhood perception stays essentially flat between Stable (41.0%) and Somewhat Stable (41.1%), then actually *drops* for Unstable (34.7%), the opposite of what a simple "worse housing, worse neighborhood" story would predict. Physical activity insufficiency swings the most dramatically, from 27.1% (Stable) up to 41.5% (Somewhat Stable) and down to just 8.6% (Unstable). Taken together, this chart resists a tidy narrative. It's tempting to assume housing instability degrades every dimension of daily life uniformly, but the data show something closer to a redistribution of disadvantage, some measures worsen, some hold steady, and at least one improves. That's a useful complication to name explicitly in the narrative: it's evidence against treating "housing instability" as a single, uniformly worsening condition, and a reminder that self-reported, categorical CHIS variables compress a lot of lived variation into three buckets.

      ## Insurance Type and Health Care Access

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/figure3-usual-source-of-care.png" alt="Bar chart of access to usual source of care by insurance type">
        <figcaption>Figure 3: Access to Usual Source of Care by Insurance Type</figcaption>
      </figure>

      The uninsured figure is the headline: only 49.9% have a usual source of care, roughly half the rate of every insured group, which range from 76.8% to 95.5%. But the more interesting story is inside that insured range. Medicaid-only enrollees report the lowest access among all insured categories at 76.8%, lower than privately purchased coverage (83.6%) and dramatically lower than dual Medicare-and-Medicaid enrollees (89.3%) or Medicare-plus-other-coverage (95.5%). That gap matters for the policy argument this section is likely building toward: simply expanding Medicaid eligibility doesn't close the access gap on its own if Medi-Cal's provider networks and reimbursement rates make it harder for enrollees to find a practice that will see them regularly. The pattern across the Medicare-based categories, all above 89%, suggests that *stacking* coverage (Medicare with Medicaid, or Medicare with supplemental insurance) does meaningfully close the gap, which raises a fairness question of its own: access to a usual source of care starts to look less like a function of being insured and more a function of how many layers of insurance a person can afford to stack.

      ## Wildfire Exposure and Protective Resources

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/figure4-filtered-air-access.png" alt="Chart of access to filtered air by poverty level and English proficiency">
        <figcaption>Figure 4: Access to Filtered Air by Poverty Level and English Proficiency</figcaption>
      </figure>

      The chart's own callout numbers frame the range clearly: filtered-air access spans from a low of 41.4% up to a high of 76.7% across the twelve poverty-by-language combinations shown. The lowest value sits among respondents combining the lowest income bracket (0-99% FPL) with limited English proficiency, while the highest sits among the highest income bracket (300%+ FPL). That endpoint pairing is the clearest evidence of a *compounding* disadvantage rather than two separate ones: being low-income alone doesn't produce the floor value, and having limited English proficiency alone doesn't either, it's the combination that does. This matters for how the Prevention section frames wildfire smoke as a health risk: filtered air is a protective resource that requires both the financial capacity to install or run it and, plausibly, the language access to learn about programs (rebates, AQI alerts, filtration assistance) that make it available. A household facing both barriers at once isn't just doubly disadvantaged, the gap between the highest and lowest access rates (over 35 percentage points) suggests the barriers interact rather than simply add. That's a strong candidate for connecting to the annotated bibliography's sources on environmental justice and access to protective infrastructure.

      <figure class="data-viz-figure">
        <img src="assets/img/dataviz/figure5-wildfire-exposure.png" alt="Chart of wildfire smoke exposure by community type">
        <figcaption>Figure 5: Wildfire Smoke Exposure by Community Type</figcaption>
      </figure>

      A majority of rural respondents, 55.58%, report having experienced wildfire smoke exposure, compared with 35.06% of urban respondents, a 20-point gap that puts rural Californians on the wrong side of a coin flip while urban Californians are not. This tracks with what's geographically expected: rural communities sit closer to the wildland-urban interface where fires ignite and burn, and are more likely to include outdoor agricultural or manual labor that can't simply retreat indoors during a smoke event. What makes this chart do real analytical work, though, is reading it next to Figure 4. The same rural communities bearing the greatest wildfire smoke exposure are, by extension, more likely to fall into the lower-income brackets where Figure 4 showed filtered-air access is weakest, meaning the population most exposed to the hazard is plausibly also the population least equipped with the protective resource that would mitigate it. That double bind, highest exposure paired with lowest protection, is a more precise and more damning finding than either chart offers alone, and it's the kind of connective argument that's worth making explicit in the narrative rather than leaving the two figures to sit side by side.
  
